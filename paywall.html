<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Scholarship Ledger</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #FBF3E0;
    color: #262220;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    background: #fff;
    border: 1px solid #E3C989;
    border-radius: 10px;
    max-width: 420px;
    width: 100%;
    padding: 36px 32px;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 8px; color: #1B2A4A; }
  p.sub { color: #6B6459; font-size: 14.5px; margin: 0 0 24px; line-height: 1.5; }
  .price { font-size: 15px; margin-bottom: 24px; color: #262220; }
  .price b { color: #1B2A4A; font-size: 20px; }
  button {
    width: 100%;
    background: #1B2A4A;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #C9C2B3; cursor: default; }
  .fine { font-size: 12px; color: #6B6459; margin-top: 14px; line-height: 1.5; }
  .error { color: #A63D40; font-size: 13.5px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>The Scholarship Ledger</h1>
    <p class="sub">Match your grades and activities to real GTA scholarships.</p>
    <div class="price">3-day free trial, then <b>$7.99 CAD</b>/month</div>
    <button id="startBtn">Start free trial</button>
    <div class="fine">Cancel anytime before your trial ends and you won't be charged.</div>
    <div class="error" id="errorMsg" style="display:none;"></div>
  </div>

<script>
  const btn = document.getElementById('startBtn');
  const errorMsg = document.getElementById('errorMsg');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Redirecting…';
    try {
      const res = await fetch('/api/create-checkout-session', { method: 'POST' });
      if (!res.ok) throw new Error('Could not start checkout');
      const data = await res.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        throw new Error('No checkout URL returned');
      }
    } catch (e) {
      errorMsg.textContent = 'Something went wrong — please try again.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Start free trial';
    }
  });
</script>
</body>
</html>
